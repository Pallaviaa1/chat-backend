services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: chat
      MYSQL_DATABASE: chat
      MYSQL_USER: chat
      MYSQL_PASSWORD: chat
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchat"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - chat_mysql:/var/lib/mysql

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "3000"
      DATABASE_URL: mysql://chat:chat@mysql:3306/chat
      FIREBASE_PROJECT_ID: demo-chat
      FIRESTORE_EMULATOR_HOST: host.docker.internal:8080
      AUTO_MIGRATE: "true"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  chat_mysql:
